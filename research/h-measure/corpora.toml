# Corpora for `cargo xtask h-measure` (s2w#56). The files are not committed (~770 MB); this
# manifest pins them. The obfuscated replicates (s2w#370) and the two `private-*` corpora
# (s2w#371) are at the end, each under its own comment; everything until then describes the
# plain Wikipedia corpora. Each of those is plain `mediawiki.recentchange`, all wikis, replayed from
# EventStreams history (`?since=`, retention ~7 days) as verbatim SSE frames that
# `s2w_sources::replay_frames` reads exactly as the live adapter reads the stream (checked
# 2026-09-29: every file gives `events` frames, every `data:` is JSON).
#
# Produced by `research/h-measure/capture.sh 2026-09-28T00:00:00Z <dir>` on 2026-09-29, before
# any H-lite threshold, key or score touched these events (hygiene, contract B3): the git log
# is the order proof. `until` bounds each window; `first_dt`/`last_dt` are the min and max
# `meta.dt` kept. A history replay delivers the codfw topic (a trickle: canaries plus a few
# dozen real events) before the eqiad topic (the traffic), so file order is by topic, then
# time, and `last_dt` is the max over both topics: with `--max-events` the eqiad data can end
# well before it (dev: eqiad ends 01:22:49, `last_dt` is a codfw event at 02:44:42). Each
# corpus starts 6 h of stream time after the previous `last_dt`.
# The files were written by eventstreams_replay.py at commit 2322bd7; later revisions write the
# same frame bytes but a different `:` header line, so a re-capture differs in the header too.
#
# Roles (plan, s2w#56 comment 5892219272), in each entry's `role` (`cargo xtask h-measure`
# freezes only on `development` and never scores `reserved`):
#   dev        development window: `freeze` discovers on it; the only corpus anyone looks at
#              while building or tuning.
#   heldout    held-out split scored by PR 3. Disjoint from dev, later in time.
#   heldout-2  second held-out span, for the spread.
#   reserved   for any later H-lite/H-min change (containment follow-up); PR 3 never opens it.
#              s2w#244 opened `reserved` itself (H-min, PROFILER_VERSION 5): its role is now
#              `heldout`; `reserved-2` and `reserved-3` were opened the same way by s2w#250.
# The split is held out from THIS measurement only: H-lite's thresholds (decision 0022,
# PROFILER_VERSION 2) were tuned earlier on `page_change` fixtures by the same project.

