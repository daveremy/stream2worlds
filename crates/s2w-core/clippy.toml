# The pure layer: no clock, no randomness, no hash-order iteration. (Per-crate clippy.toml
# replaces the workspace one, so the test allowances are repeated here.)
allow-unwrap-in-tests = true
allow-expect-in-tests = true
disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "the core is pure: take time as an argument" },
  { path = "std::time::Instant::now", reason = "the core is pure: take time as an argument" },
  { path = "std::thread::sleep", reason = "the core does no I/O or waiting" },
]
disallowed-types = [
  { path = "std::collections::HashMap", reason = "iteration order is not deterministic: use BTreeMap" },
  { path = "std::collections::HashSet", reason = "iteration order is not deterministic: use BTreeSet" },
  { path = "std::fs::File", reason = "the core does no I/O" },
  { path = "std::net::TcpStream", reason = "the core does no I/O" },
]
