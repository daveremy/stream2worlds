[package]
name = "s2w-app"
description = "Runtime wiring: composes sources, log, core and engines; read-only MCP; local web view."
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
memory-serve = "=2.4.0"
s2w-model = { path = "../s2w-model" }
s2w-core = { path = "../s2w-core" }
s2w-log = { path = "../s2w-log" }
s2w-sources = { path = "../s2w-sources" }
s2w-system1 = { path = "../s2w-system1" }
s2w-system2 = { path = "../s2w-system2" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
# The read-only MCP server (decision 0009), stdio only: `server` pulls the tool system,
# schemars and uuid; `transport-io` the stdio transport (rmcp enables tokio's `io-std` on its
# own dependency, so s2w-app's tokio feature list is unchanged).
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "macros", "transport-io"] }
# The snapshot payload codec (decision 0021): compact, deterministic for BTree-only worlds, no
# `deserialize_any`. `use-std` for `to_stdvec`; no default features (no heapless, no embedded-io).
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `rt` for the runtime this crate builds, `net` and `time` for the I/O and timer drivers
# reqwest's async client needs underneath it (`enable_all` enables exactly those two);
# `macros` and `sync` for the query API's SSE broadcast.
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-stream = "0.1"
# `statfs` for the status line's filesystem check and free-space figure (s2w#32).
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
# The snapshot golden-equivalence test generates event streams (decision 0021).
proptest = "1"
# Heap profiling for the ignored `scale_mem` test (s2w#32).
dhat = "=0.3.3"
# Instruction-count benchmark `scale_ir`, run under valgrind by `cargo xtask scale` (s2w#32).
gungraun = "=0.20.0"
# `client` turns rmcp into an in-process MCP client for the stdio round-trip test.
rmcp = { version = "=3.4.1", default-features = false, features = ["client"] }
# Produces records for the ignored real-broker test; pinned like s2w-sources (decision 0007).
rskafka = "=0.6.0"
# `io-util` for the `tokio::io::duplex` pipe that test runs the server over; `test-util` for
# time-mocking in the group-commit / kafka-cursor tests.
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "test-util", "time"] }
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "scale_ir"
harness = false

[[bench]]
name = "scale_wall"
harness = false

[build-dependencies]
memory-serve = "=2.4.0"
