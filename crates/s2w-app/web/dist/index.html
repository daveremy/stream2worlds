<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<!-- `/w/<world>/` shifts the browser's relative-asset base; this makes every relative URL
     (stylesheet, script, fetch) resolve against `/` regardless of path depth. Trade-off: this
     breaks hosting behind a reverse-proxy path prefix — accepted for PR1. -->
<base href="/">
<title>Stream2Worlds · World view</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><h1 id="world-title">Stream2Worlds</h1><p id="world-tagline">A living world, as it happens.</p>
<p id="world-description" hidden></p></header>
<form id="controls">
<label>World<input name="world" placeholder="default" required></label>
<label>Branch<input name="branch" value="actual" required></label>
<label>Offset<input name="at" type="number" min="0" step="1" placeholder="Live"></label>
<label>Detail<select name="lod"><option value="entity">Entities</option><option value="type">Types</option></select></label>
<label>Focus entity<input name="focus" type="number" min="0" step="1" placeholder="All"></label>
<label>Hops<input name="hops" type="number" min="0" max="5" step="1" value="1"></label>
<button type="submit">Apply view</button><button type="button" id="pin">Pin this moment</button>
<button type="button" id="live">Go live</button>
</form>
<p id="status" role="status" aria-live="polite">Connecting</p><p id="position"></p>
<main><section aria-label="World graph"><div id="graph"></div>
<div class="graph-details"><div id="legend" aria-label="Type legend"></div>
<div id="active" aria-label="Active now and hubs"></div></div></section>
<section><h2 id="events-heading">Evidence <small>Latest 500 events · newest first</small></h2>
<div class="table-scroll"><table id="evidence" aria-label="Evidence events"></table></div></section>
<section><h2>Proposals <small>Grades are n/d counts; 0/0 means no evidence yet</small></h2>
<div id="proposals" aria-label="Proposals"></div></section></main>
<footer>Share a pinned moment by copying its URL. <a href="/THIRD-PARTY-LICENSES.txt">Third-party notices</a></footer>
<script type="module" src="/main.js"></script>
</body></html>
