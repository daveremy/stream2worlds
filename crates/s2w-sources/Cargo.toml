[package]
name = "s2w-sources"
description = "Stream sources: Wikipedia EventStreams, Kafka by partition assignment, stdin NDJSON."
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rskafka = "=0.6.0"
serde_json.workspace = true
s2w-model = { path = "../s2w-model" }
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-util"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
