name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: fitness functions
        run: cargo run --quiet --package xtask -- check  # not the alias: a .cargo/config would hide it
      - name: demo scripts (offline only -- demos themselves read a live stream, run them yourself)
        run: |
          shopt -s nullglob
          scripts=(demos/*/run.sh)
          [ "${#scripts[@]}" -gt 0 ]
          for script in "${scripts[@]}"; do bash -n "$script"; done
          shellcheck --severity=error "${scripts[@]}"
      - name: licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.98"
          command: check licenses advisories bans
  scale:
    # Fold instructions per event under Valgrind (s2w#32, decision 0004). The [ir] baseline in
    # xtask/scale-baseline.toml belongs to this image; bumping it re-sets that baseline.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - name: valgrind
        run: sudo apt-get update && sudo apt-get install --yes valgrind
      - name: gungraun-runner (must equal the gungraun pin in crates/s2w-app/Cargo.toml)
        uses: taiki-e/install-action@v2
        with:
          tool: gungraun-runner@0.20.0
      - name: scale fitness function
        run: cargo run --quiet --package xtask -- scale
      - name: drop benchmark output from the cache
        if: always()
        run: rm -rf target/tmp/scale target/gungraun  # scale_wall writes under CARGO_TARGET_TMPDIR
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/s2w-app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: crates/s2w-app/web/.nvmrc
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: committed bundle matches clean build (including untracked files)
        run: test -z "$(git status --porcelain -- dist)"
      - run: npm run licenses
      - run: npm run test:licence-gate
