name: ci
# Runner selection (daveremy/lifeos#1234): self-hosted `s2w` runner on hub by default.
# Escape hatch: `gh variable set S2W_RUNNER --body down -R daveremy/stream2worlds` sends every
# job to GitHub-hosted ubuntu (billed minutes); `gh variable delete S2W_RUNNER` restores
# self-hosted. A missing runner makes jobs QUEUE, not fail.
# Self-hosted rules: never write under bare /tmp (16 GB shared tmpfs) -- TMPDIR and
# CARGO_TARGET_DIR are set by the "self-hosted paths" step below; the runner user cannot read /home/dave.
# Exception, deliberate (s2w#369): test EXECUTION gets TMPDIR on a per-job /dev/shm dir. Tests keep
# SQLite stores under temp_dir and fsync on every write; on the shared ext4 disk those fsyncs stalled
# 15-22 s under hub IO pressure and timed tests out. The dir is small (measured peak 16 MB, ~1 MB at
# end of run), removed after the job, and dirs older than a day are swept. Compilation stays on
# disk, except doctests, which rustdoc builds during the run.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    timeout-minutes: 60
    runs-on: &s2w-runner ${{ vars.S2W_RUNNER == 'down' && 'ubuntu-latest' || fromJSON('["self-hosted","s2w"]') }}
    steps:
      - name: self-hosted paths (no bare /tmp; per-job cargo target under the runner user's cache)
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "$HOME/.cache/cargo-target/s2w-gates" "$RUNNER_TEMP/tmp"
          echo "CARGO_TARGET_DIR=$HOME/.cache/cargo-target/s2w-gates" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'  # self-hosted keeps a persistent target dir instead
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rustdoc (broken or private intra-doc links fail, s2w#251)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: test scratch on tmpfs (s2w#369; self-hosted only, hosted keeps its TMPDIR)
        if: runner.environment == 'self-hosted'
        run: |
          # Sweep dirs a killed job could not remove (its always() step never ran).
          find /dev/shm -maxdepth 1 -name 's2w-test-*' -user "$(id -u)" -mmin +1440 -exec rm -rf -- {} +
          dir="/dev/shm/s2w-test-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          mkdir -p "$dir"
          echo "S2W_TEST_TMPDIR=$dir" >> "$GITHUB_ENV"
      - name: test
        run: |
          cargo test --workspace --no-run
          # Hosted runners leave TMPDIR unset; never export an empty one (temp_dir() would be "").
          if [ -n "${S2W_TEST_TMPDIR:-}" ]; then export TMPDIR="$S2W_TEST_TMPDIR"; fi
          cargo test --workspace
      - name: remove tmpfs test scratch
        if: always() && env.S2W_TEST_TMPDIR != ''
        run: |
          case "$S2W_TEST_TMPDIR" in /dev/shm/s2w-test-?*) rm -rf -- "$S2W_TEST_TMPDIR" ;; esac
      - name: fitness functions
        run: cargo run --quiet --package xtask -- check  # not the alias: a .cargo/config would hide it
      - name: demo scripts (offline only -- demos themselves read a live stream, run them yourself)
        run: |
          shopt -s nullglob
          scripts=(demos/*/run.sh)
          [ "${#scripts[@]}" -gt 0 ]
          for script in "${scripts[@]}"; do bash -n "$script"; done
          shellcheck --severity=error "${scripts[@]}"
      - name: licenses and advisories (cargo-deny binary, not the docker action, which the runner user cannot run)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check licenses advisories bans
  scale:
    timeout-minutes: 60
    # Fold instructions per event under Valgrind (s2w#32, decision 0004). The [ir] baseline in
    # xtask/scale-baseline.toml is per runner image (hosted ubuntu-latest vs the hub runner's valgrind/glibc differ); switching runner mode can trip it and needs a re-baseline.
    # scale pins its hosted fallback to ubuntu-24.04: the instruction-count baseline depends on that image.
    runs-on: ${{ vars.S2W_RUNNER == 'down' && 'ubuntu-24.04' || fromJSON('["self-hosted","s2w"]') }}
    steps:
      - name: self-hosted paths (no bare /tmp; per-job cargo target under the runner user's cache)
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "$HOME/.cache/cargo-target/s2w-scale" "$RUNNER_TEMP/tmp"
          echo "CARGO_TARGET_DIR=$HOME/.cache/cargo-target/s2w-scale" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - name: valgrind (hosted uses apt, self-hosted needs it preinstalled because the runner user has no sudo)
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            sudo apt-get update && sudo apt-get install --yes valgrind
          else
            command -v valgrind
          fi
      - name: gungraun-runner (must equal the gungraun pin in crates/s2w-app/Cargo.toml)
        uses: taiki-e/install-action@v2
        with:
          tool: gungraun-runner@0.20.0
      - name: scale fitness function
        run: cargo run --quiet --package xtask -- scale
      - name: drop benchmark output from the cache
        if: always()
        run: rm -rf "${CARGO_TARGET_DIR:-target}/tmp/scale" "${CARGO_TARGET_DIR:-target}/gungraun"  # scale_wall writes under CARGO_TARGET_TMPDIR
  bundle:
    timeout-minutes: 30
    runs-on: *s2w-runner
    defaults:
      run:
        working-directory: crates/s2w-app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: crates/s2w-app/web/.nvmrc
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: committed bundle matches clean build (including untracked files)
        run: test -z "$(git status --porcelain -- dist)"
      - run: npm run licenses
      - run: npm run test:licence-gate
