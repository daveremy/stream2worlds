# Scale baseline (s2w#32; decision 0004; research 0006 §12). Human-owned, like the golden files.
#
# Read by `cargo xtask check` ([memory], via s2w-app's ignored `scale_mem` tests), by
# `cargo xtask scale` ([ir], fold instructions under Valgrind, and [parse], System 1 parse
# instructions; CI job 'scale') and by `cargo xtask discover-volume` ([discover_volume], CI job
# 'discover-volume'). Every key is
# required. Two event supplies are gated side by side (s2w#174): the seeded generator ([ir],
# [memory]) and the recorded fixture ([recorded], [ir.recorded], [memory.recorded]).
# A measurement more than `tolerance_percent` above its baseline fails. Raising
# fold_ir_per_event (either supply), parse_ir_per_event, bytes_per_entity (either supply),
# any events / entities size, target_bytes_per_entity,
# budget_bytes_per_entity, [discover_volume] heap_bytes, budget_bytes, events or window, or
# tolerance_percent against origin/main needs a
# `Baseline-growth: s2w#<N>` trailer on a commit in the PR and a reason in the PR body.
# `cargo xtask check --tighten-baseline` lowers [memory] values and `cargo xtask discover-volume
# --tighten-baseline` lowers [discover_volume] heap_bytes; neither raises anything, and nothing
# touches [ir] or [parse].

tolerance_percent = 5
set_by = "s2w#32 (2026-09-28); [memory] ratcheted by s2w#172 (2026-09-29), raised by s2w#271 (2026-09-29); recorded supply s2w#174 (2026-09-29); [parse] s2w#166 (2026-09-29); [discover_volume] s2w#392 (2026-10-01)"

# The recorded fixture, crates/s2w-app/tests/fixtures/recorded-10min.raw.sse: FNV-1a 64 of its
# bytes, the same pin as FIXTURE_HASH in crates/s2w-app/tests/support/recorded.rs. Both runners
# refuse to measure a changed recording. Human-owned: never re-pinned to make a gate pass.
[recorded]
fixture_fnv1a64 = 0x070e_ba9f_7d43_edcd

# Instructions per event are owned by the CI image below: Valgrind counts are stable on one
# image and compiler, not across machines, so a local run is not the baseline. Set from the
# first CI run of job `scale`.
[ir]
fold_ir_per_event = 5764 # measured by CI run 36563251251 (job scale), 2026-09-29
ci_image = "ubuntu-24.04"
events = 100000 # IR_EVENTS in crates/s2w-app/tests/support/scale_generator.rs; checked
rustc = "rustc 1.98.1 (48a229cea 2026-09-01)"
profile = "bench"

# The recorded fixture's claims, folded in emission order (s2w-app bench
# fold_ir_per_event_recorded), divided by its raw events. Same image, rustc and profile as [ir].
[ir.recorded]
fold_ir_per_event = 15285 # measured by CI run 36569430562 (job scale), 2026-09-29
events = 11667 # frames with id and data in the fixture; xtask counts them and checks

# System 1 parse (s2w#166): every raw event of the recorded fixture through MappingEngine with
# the committed linked mapping (crates/s2w-app/tests/fixtures/recorded-links.mapping.json), one
# evaluate per event in file order (s2w-app bench parse_ir_per_event), divided by the raw
# events. Same image, rustc and profile as [ir].
[parse]
parse_ir_per_event = 215248 # measured by CI run 36667578506 (job scale), 2026-09-29
events = 11667 # the same fixture's frames; xtask checks it against the count too

# Heap bytes per entity after folding entity-observed events, counted by dhat (test profile).
[memory]
# Measured 830 B on 2026-09-28, 438 B after s2w#172 stored entity attributes as a sorted Vec,
# then 360 B after s2w#190 indexed entities by dense id in a Vec (hub, rustc 1.98.1), then
# 369 B after s2w#271 put each state behind an Arc (decision 0028: 16 B count header per state,
# 8 B Vec slot instead of 56 B). The Vec doubles, so at 100,000 entities it holds 131,072
# slots: the figure steps at powers of two. Baseline; > +tolerance fails.
bytes_per_entity = 369
# Decision 0004's planning target; printed with the measured ratio, not a ceiling. Raising it
# is growth.
target_bytes_per_entity = 300
# Hard ceiling: decision 0004's 2x line over the 300 B target (was an interim 900 B while the
# measured 830 B sat at 2.77x; s2w#172 brought it under). Above this always fails. The baseline
# plus tolerance fires first; this is the backstop if the baseline is ever raised.
budget_bytes_per_entity = 600
# Informational: heap bytes per relationship-observed event after the entities.
bytes_per_relationship_reported = 234
entities = 100000 # MEM_ENTITIES in the generator; the test's JSON line must agree

# The recorded fixture's claims: entity-observed first, then relationship-observed (s2w-app
# test bytes_per_entity_and_relationship_recorded). Shares [memory]'s target and budget.
[memory.recorded]
# Measured 346 B on 2026-09-29 (hub, rustc 1.98.1), 349 B after s2w#271 (Arc per state). The
# synthetic figure steps at powers of two of its entity count, so the two supplies are not
# expected to match.
bytes_per_entity = 349
bytes_per_relationship_reported = 409 # informational
entities = 11462 # pinned; the test's JSON line must agree
relationships = 19512 # pinned; the test's JSON line must agree

# World heap after folding 10^5 fresh-string events of the recorded fixture (cycled, every
# string leaf suffixed per cycle: the upper bound) under the mapping serve's profiler settings
# (links off) discover from its first 10k events (s2w-app test discover_volume_heap, fresh child;
# decisions 0022, 0025; s2w#392). Counted by dhat, release profile: the fold allocates the same
# sequence every run, so the figure reproduces to the byte (two hub runs, 2026-10-01).
[discover_volume]
# First measured 399,243,516 B (380.7 MiB) on 2026-10-01, PROFILER_VERSION 9, hub, rustc
# 1.98.1; `--tighten-baseline` may lower the value below that figure. Baseline; > +tolerance
# fails. Accepted as is, not bisected (s2w#392 ruling, 2026-10-01).
heap_bytes = 399243516
# Hard ceiling: decision 0025's deploy line, 480 MiB resident, restated in heap bytes with the
# exact measured heap/RSS ratio: 503,316,480 x 399,243,516 / 408,956,928, rounded up (the ratio
# is about 0.97625). Leaves room for version-2 links: the same fold with links on measured
# 465 MiB resident (+75 MiB, s2w#245), about 476 MB of heap. Above this always fails.
budget_bytes = 491361871
# Informational: the plain discover_volume target's VmRSS delta for the same fold (390.0 MiB,
# the figure decisions 0022 and 0025 quote), from a release hand run on 2026-10-01. Set by hand;
# the gate's dhat run cannot measure it.
rss_bytes_reported = 408956928
entities = 154018 # pinned; the test's JSON line must agree
relationships = 1412074 # pinned; the test's JSON line must agree
events = 100000 # EVENTS in crates/s2w-app/tests/discover_volume.rs; the JSON line must agree
window = 10000 # DISCOVER_WINDOW in crates/s2w-app/src/discover.rs; the JSON line must agree
