# Every dependency edge in the workspace. An allowlist, not a denylist: an edge not listed here
# fails `cargo xtask check`, and so does a listed edge nobody uses. Layer rules and reasons live
# in docs/decisions/0001-workspace-layers.md and each crate's AGENTS.md.

[crates.s2w-model]
normal = ["serde", "thiserror"]
dev = ["serde_json"]

[crates.s2w-core]
normal = ["s2w-model", "serde"]
dev = ["serde_json", "proptest", "insta"]

[crates.s2w-log]
normal = ["s2w-model", "rusqlite", "serde", "serde_json"]

[crates.s2w-sources]
normal = ["s2w-model", "reqwest", "rskafka", "tokio", "serde_json", "tokio-stream", "thiserror"]

[crates.s2w-system1]
normal = ["s2w-model", "serde", "serde_json", "thiserror"]

[crates.s2w-discover]
normal = ["s2w-model", "serde_json"]

[crates.s2w-system2]
normal = ["s2w-model"]

[crates.s2w-app]
normal = ["s2w-model", "s2w-core", "s2w-log", "s2w-sources", "s2w-system1", "s2w-system2", "memory-serve", "axum", "postcard", "rmcp", "serde", "serde_json", "thiserror", "tokio", "tokio-stream"]
dev = ["proptest", "rmcp", "rskafka", "tokio", "tower"]
build = ["memory-serve"]

[crates.s2w]
normal = ["s2w-app", "s2w-log", "s2w-model", "serde_json"]

[crates.s2w-testkit]
normal = ["s2w-model", "s2w-log"]

[crates.xtask]
normal = ["serde", "serde_json", "toml", "s2w-core", "s2w-model", "s2w-system1", "syn", "proc-macro2"]

# Every external dependency names the README "Technical architecture" row that explains it.
[external.serde]
readme_row = "Serialization and errors"

[external.serde_json]
readme_row = "Serialization and errors"

[external.thiserror]
readme_row = "Serialization and errors"

[external.reqwest]
readme_row = "Sources"

[external.rskafka]
readme_row = "Sources"

[external.tokio]
readme_row = "Sources"

[external.tokio-stream]
readme_row = "Sources"

[external.axum]
readme_row = "World query API"

[external.rmcp]
readme_row = "Read-only MCP server"

[external.tower]
readme_row = "World query API"

[external.rusqlite]
readme_row = "Event log"

[external.postcard]
readme_row = "World snapshots"

[external.toml]
readme_row = "Fitness functions"

[external.proptest]
readme_row = "Property & snapshot testing"

[external.insta]
readme_row = "Property & snapshot testing"

[external.syn]
readme_row = "Fitness functions"

[external.proc-macro2]
readme_row = "Fitness functions"

[external.memory-serve]
readme_row = "Dashboard"
