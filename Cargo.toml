[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/daveremy/stream2worlds"
rust-version = "1.98"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# "forbid" cannot be overridden by any attribute, inner or outer (decision 0001). Changing one
# of these needs a decision record and an edit here, visible in review.
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
todo = "forbid"
unimplemented = "forbid"
dbg_macro = "forbid"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Function shape; thresholds live in every clippy.toml (xtask check 8 keeps them equal).
too_many_lines = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"

# Limited debuginfo (line tables, no variable/type info): backtraces keep file:line and a
# cold build is ~9% faster than the default full debuginfo (lifeos#1113, s2w#41).
[profile.dev]
debug = 1

# Line tables in benchmark builds so Callgrind attributes instructions by function (s2w#32).
[profile.bench]
debug = 1
